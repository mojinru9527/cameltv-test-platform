name: AI/Git 交付门禁

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-policy:
    name: AI/Git 交付策略
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CI scope classifier contract
        run: python scripts/ci/test_classify_ci_changes.py

      # Batch 242: keep the required-gate workflow contract asserted. These
      # checks previously lived in an unreferenced test file, so CI gate
      # regressions (renamed jobs, dropped steps) went unnoticed.
      - name: Validate required-gate workflow contracts
        run: python scripts/ci/test_batch59_quality_contracts.py

      - name: Validate release capacity and retention safeguards
        run: |
          python -m pip install -r deploy/release-console/requirements.txt httpx
          python -m unittest discover -s deploy/release-console/tests -v

      - name: Validate upload capacity admission
        shell: pwsh
        run: ./scripts/ops/test-capacity.ps1
      - name: Release build metadata smoke
        shell: pwsh
        run: ./scripts/ops/test-release-build.ps1
      - name: Reject failed release uploads
        shell: pwsh
        run: ./scripts/ops/test-release-transfer.ps1
      - name: Validate simplified deploy Compose contract
        run: python scripts/ops/test_deploy_compose.py

      - name: Validate changed workflow YAML syntax
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pip install pyyaml >/dev/null 2>&1
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '.github/workflows/*.yml' > "$RUNNER_TEMP/workflow-files" || true
          if [ ! -s "$RUNNER_TEMP/workflow-files" ]; then
            echo "No workflow YAML changed; syntax validation skipped."
            exit 0
          fi
          python - "$RUNNER_TEMP/workflow-files" <<'PY'
          import sys, yaml
          with open(sys.argv[1], encoding='utf-8') as fh:
              files = [line.strip() for line in fh if line.strip()]
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f"OK {f}")
          print(f"Validated {len(files)} workflow YAML file(s)")
          PY

      - name: Run deploy/release-control tests
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- 'deploy/release-control/' > "$RUNNER_TEMP/deploy-files" || true
          if [ ! -s "$RUNNER_TEMP/deploy-files" ]; then
            echo "deploy/release-control unchanged; tests skipped."
            exit 0
          fi
          cd deploy/release-control
          pip install -e . pytest >/dev/null 2>&1
          python -m pytest -q

      - name: Validate branch, local-only files, and secrets
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "::error::PR base must be main, got '$BASE_BRANCH'."
            exit 1
          fi
          if [[ ! "$HEAD_BRANCH" =~ ^(feature|fix|hotfix|release)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::PR head '$HEAD_BRANCH' must use feature/fix/hotfix/release kebab-case naming."
            exit 1
          fi

          git diff --name-only --diff-filter=ACMR "origin/$BASE_BRANCH...HEAD" > changed-files.txt
          if grep -E '(^|/)\.ai-worktree\.json$|(^|/)\.env(\.local)?$|\.(db|sqlite|sqlite3)$' changed-files.txt; then
            echo "::error::PR contains local-only AI metadata, environment, or database files."
            exit 1
          fi

          # 凭据扫描（P0-2）：必须覆盖本平台**实际使用**的凭据形态。
          # 旧规则只有 ghp_/github_pat_/AKIA/私钥，漏掉了平台自己的 tpat_/agt_
          # 与 DeepSeek 的 sk- Key——正因如此，一个**仍然可用**的 tpat_ Token 长期
          # 留在公开仓库的证据文件里而没有被任何门禁拦下。
          # `(^|[^A-Za-z0-9])` 前缀守卫是必需的：disk-/risk-/task-/mask- 等普通词
          # 都含有 "sk-"，不加守卫会把 minified JS 与运维脚本刷成一片误报。
          # 命中时只报告结论、不回显匹配内容（避免把密钥二次写进 CI 日志）。
          CREDENTIAL_PATTERNS='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|(^|[^A-Za-z0-9])sk-[A-Za-z0-9]{20,}|(^|[^A-Za-z0-9])tpat_[A-Za-z0-9_-]{16,}|(^|[^A-Za-z0-9])agt_[A-Za-z0-9_-]{16,}'
          PLACEHOLDER_ALLOWLIST='(sk-(test|xxx|your|example|placeholder|redacted)|tpat_XXXXXXXX|agt_XXXXXXXX|<REDACTED>|CHANGE_?ME|change-me)'

          added_lines="$(git diff --unified=0 "origin/$BASE_BRANCH...HEAD" | grep -E '^\+' || true)"
          if printf '%s\n' "$added_lines" \
            | grep -vE "$PLACEHOLDER_ALLOWLIST" \
            | grep -qE "$CREDENTIAL_PATTERNS"; then
            echo "::error::Potential credential or private key found in added lines. Revoke/rotate it, keep it in a secret manager, and never commit it."
            exit 1
          fi

          echo "AI/Git delivery policy passed for $HEAD_BRANCH -> $BASE_BRANCH"
