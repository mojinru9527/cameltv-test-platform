name: AIQE V1.6 交付门禁

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    tags: ["aiqe-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  traceability:
    name: Traceability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install gate dependencies
        run: pip install pyyaml jsonschema
      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -c "import os; open('pr-body.md','w',encoding='utf-8').write(os.environ.get('PR_BODY') or '')"
      - name: Collect changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
      # v2：strict warnings 进 CI；缺失/漂移的证据格式直接阻断，不再只打印 warning。
      - name: Traceability matrix validation (strict + baseline)
        run: python scripts/aiqe/check_traceability.py --strict-warnings --check-baseline
      - name: Release audit (secrets / fake E2E / docs / verdict consistency)
        run: python scripts/aiqe/check_release_audit.py
      - name: Audit closure ledger
        run: python scripts/aiqe/check_audit_closure.py --check
      - name: Credential scan (current SHA)
        run: python scripts/aiqe/scan_credentials.py --output work-logs/evidence/aiqe-v16/credential-scan.json
      - name: Product TC config validation
        run: python scripts/aiqe/run_product_tc.py --check-config
      - name: PR traceability fields
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, subprocess, sys
          body = open("pr-body.md", encoding="utf-8").read()
          issues = sorted(set(re.findall(r"V16-0\d\d", body)))
          if not issues:
              print("::error::PR 描述必须声明至少一个 V16 Issue")
              sys.exit(1)
          args = [
              "python", "scripts/aiqe/check_traceability.py",
              "--pr-body", "pr-body.md",
              "--changed-files", "changed-files.txt",
              "--pr-author", os.environ.get("PR_AUTHOR", ""),
          ]
          for issue in issues:
              args += ["--issue", issue]
          sys.exit(subprocess.call(args))
          PY
      # 矩阵快照：只表示“矩阵声明了什么”，不是运行证据（artifact_kind 已显式标注）。
      - name: Emit matrix snapshot
        run: |
          python scripts/aiqe/check_traceability.py \
            --emit-evidence-index traceability-matrix-snapshot.json \
            --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --ci-run "${{ github.run_id }}" \
            --environment ci
          python scripts/aiqe/check_traceability.py --emit-markdown traceability-matrix.md
      - name: Emit release verdict
        run: |
          python scripts/aiqe/release_verdict.py --write \
            --emit-markdown release-verdict.md \
            --emit-e2e-doc e2e-coverage.md
      - name: Upload governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiqe-v16-governance
          path: |
            traceability-matrix-snapshot.json
            traceability-matrix.md
            release-verdict.md
            e2e-coverage.md
            docs/aiqe/v1.6/release-verdict.json
            work-logs/evidence/aiqe-v16/credential-scan.json
          retention-days: 90

  lint-type:
    name: Build & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt
      - working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest -r requirements-quality.txt
      - name: Ruff F821
        working-directory: test-platform-v2/backend
        run: ruff check app/ --select F821 --output-format=github
      - name: Quality ratchet (ruff/mypy)
        run: python scripts/ci/quality_ratchet.py
      - name: Migration single head + roundtrip
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: sqlite:///./data/v16_ci.db
        run: python scripts/ci/check_aiqe_v16_migrations.py

  unit-integration:
    name: Unit / Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt
      - working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest -r requirements-quality.txt
      - name: Install Chromium for Playwright browser tests
        working-directory: test-platform-v2/backend
        run: python -m playwright install --with-deps chromium
      - name: AIQE unit + integration tests
        working-directory: test-platform-v2/backend
        run: |
          python -m pytest tests -q -p no:cacheprovider -k "aiqe" \
            --junitxml=../../work-logs/evidence/aiqe-v16/junit-unit.xml
      # V16-017：平台链路 E2E 产出机器结果（TC-PLATFORM-*），再由 builder 生成运行证据索引。
      - name: Platform chain E2E with machine results
        working-directory: test-platform-v2/backend
        env:
          AIQE_PLATFORM_RESULTS: ../../work-logs/evidence/aiqe-v16/platform-results.json
          AIQE_ENVIRONMENT: ci
        run: |
          python -m pytest tests/e2e/aiqe/test_v16_017_platform_chain.py \
            tests/e2e/aiqe/test_v16_017_tc001_contract.py \
            -q -p no:cacheprovider \
            --junitxml=../../work-logs/evidence/aiqe-v16/junit-platform.xml
      - name: Build runtime evidence index
        run: |
          python scripts/aiqe/build_evidence_index.py \
            --input work-logs/evidence/aiqe-v16/platform-results.json \
            --pr-head-sha "${{ github.event.pull_request.head.sha || '' }}" \
            --merge-commit-sha "${{ github.sha }}" \
            --ci-run "${{ github.run_id }}" \
            --workflow-attempt "${{ github.run_attempt }}" \
            --job-id "${{ github.job }}" \
            --environment ci \
            --runtime-type host \
            --output work-logs/evidence/aiqe-v16/evidence-index.json \
            --require-tcs 10
      - name: Upload test report and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiqe-v16-unit-and-runtime
          path: |
            work-logs/evidence/aiqe-v16/junit-unit.xml
            work-logs/evidence/aiqe-v16/junit-platform.xml
            work-logs/evidence/aiqe-v16/platform-results.json
            work-logs/evidence/aiqe-v16/evidence-index.json
          retention-days: 90

  runtime-security:
    name: Runtime / Negative Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt
      - working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest -r requirements-quality.txt
          python -m playwright install --with-deps chromium
      - name: V16 P0 runtime/negative suites
        working-directory: test-platform-v2/backend
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_aiqe_v16_001_policy_fail_closed.py \
            tests/test_aiqe_v16_002_playwright_interception.py \
            tests/test_aiqe_v16_025_traceability_gate.py \
            tests/test_aiqe_release_audit.py \
            tests/test_aiqe_v16_024_image_dependencies.py \
            --junitxml=../../work-logs/evidence/aiqe-v16/junit-runtime.xml
      - name: Static fail-open scan
        working-directory: test-platform-v2/backend
        run: python scripts/ci/check_aiqe_v16_static_gates.py
      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiqe-v16-runtime-junit
          path: work-logs/evidence/aiqe-v16/junit-runtime.xml
          retention-days: 90

  migration:
    name: Migration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt
      - working-directory: test-platform-v2/backend
        run: pip install -r requirements.txt
      - name: Alembic upgrade / downgrade / upgrade
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: sqlite:///./data/v16_migration_ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic heads | tee heads.txt
          test "$(wc -l < heads.txt)" -eq 1

  # 发布门禁：只在 release 分支 / release tag 运行；GA 未签署时明确失败，禁止带病发布。
  release-gate:
    name: Release Gate (GA verdict)
    if: ${{ startsWith(github.ref, 'refs/tags/aiqe-v') || startsWith(github.head_ref, 'release/') }}
    # 证据清单需要其他 gate 的 JUnit / runtime artifact，必须先等它们完成。
    needs:
      - traceability
      - lint-type
      - unit-integration
      - runtime-security
      - migration
    runs-on: ubuntu-latest
    # 产品 E2E 10 条 TC 现场执行 + 证据清单，预留比纯静态门禁更长的预算。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install pyyaml jsonschema
      - name: Traceability release gate (independent acceptance required)
        env:
          # 仅 tag 发布时强制“矩阵基线 == 被发布 commit”；PR 场景留空。
          EXPECTED_COMMIT: ${{ github.ref_type == 'tag' && github.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "${EXPECTED_COMMIT}" ]; then
            python scripts/aiqe/check_traceability.py --strict-warnings --check-baseline \
              --release-gate --expected-commit "${EXPECTED_COMMIT}"
          else
            python scripts/aiqe/check_traceability.py --strict-warnings --check-baseline --release-gate
          fi
      - name: Branch protection evidence
        run: python scripts/aiqe/check_branch_protection.py --check
      - name: Audit closure ledger
        run: python scripts/aiqe/check_audit_closure.py --check
      # FIX-002 / FIX-013：产品 E2E 只有在 release/tag 场景真实执行，PR 上不得伪造产品 PASS。
      - name: Product E2E real execution (release / tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/aiqe-v') || startsWith(github.head_ref, 'release/') }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/aiqe/run_product_tc.py ]; then
            echo "::error::[aiqe-gate] scripts/aiqe/run_product_tc.py 缺失，产品 E2E 无法执行（BLOCKED）"
            exit 1
          fi
          python scripts/aiqe/run_product_tc.py --run
          if [ ! -f scripts/aiqe/verify_product_tc_results.py ]; then
            echo "::error::[aiqe-gate] scripts/aiqe/verify_product_tc_results.py 缺失，产品 TC 结果无法验证（BLOCKED）"
            exit 1
          fi
          python scripts/aiqe/verify_product_tc_results.py --require-pass
      # FIX-015：GA 场景汇总证据清单；任一证据缺失即 complete=false 并阻断签署。
      - name: Download AIQE gate artifacts for evidence manifest
        if: ${{ startsWith(github.ref, 'refs/tags/aiqe-v') || startsWith(github.head_ref, 'release/') }}
        uses: actions/download-artifact@v4
        with:
          pattern: aiqe-v16-*
          path: work-logs/evidence/aiqe-v16
          merge-multiple: true
      - name: Build release evidence manifest (--require-complete)
        if: ${{ startsWith(github.ref, 'refs/tags/aiqe-v') || startsWith(github.head_ref, 'release/') }}
        run: |
          set -euo pipefail
          python scripts/aiqe/build_evidence_manifest.py \
            --commit-sha "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --environment "ci" \
            --output work-logs/evidence/aiqe-v16/evidence-manifest.json \
            --markdown work-logs/evidence/aiqe-v16/evidence-manifest.md \
            --require-complete
      - name: GA verdict
        env:
          AIQE_EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/aiqe/release_verdict.py --require-ga
      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiqe-v16-release-gate
          path: |
            docs/aiqe/v1.6/release-verdict.json
            work-logs/evidence/aiqe-v16/evidence-manifest.json
            work-logs/evidence/aiqe-v16/evidence-manifest.md
          retention-days: 90

  # FIX-013：稳定 Aggregate Gate（Main Ruleset required check 的精确 context）。
  # 名称必须与 validators.branch.AIQE_AGGREGATE_CHECK 完全一致，不得改名。
  aiqe-aggregate:
    name: AIQE V1.6 Governance Gate
    if: ${{ always() }}
    needs:
      - traceability
      - lint-type
      - unit-integration
      - runtime-security
      - migration
      - release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate required gate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_CONTEXT: ${{ startsWith(github.ref, 'refs/tags/aiqe-v') || startsWith(github.head_ref, 'release/') }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          release_ctx = os.environ.get("RELEASE_CONTEXT") == "true"
          required_jobs = [
              "traceability",
              "lint-type",
              "unit-integration",
              "runtime-security",
              "migration",
          ]
          failures = []
          for job in required_jobs:
              result = str((needs.get(job) or {}).get("result") or "missing")
              print(f"{job}={result.upper()}")
              if result != "success":
                  failures.append(f"{job}={result}")
          release = str((needs.get("release-gate") or {}).get("result") or "missing")
          if release == "skipped" and not release_ctx:
              # PR 场景 release-gate 被 skip：显式标注，skip 不等于 PASS。
              print("release_gate=SKIPPED(PR)")
          elif release == "skipped":
              print("release_gate=SKIPPED_BUT_REQUIRED")
              failures.append("release-gate=skipped(release/tag)")
          else:
              print(f"release_gate={release.upper()}")
              if release != "success":
                  failures.append(f"release-gate={release}")
          if release_ctx:
              print(
                  "product_e2e=VERIFIED_BY_RELEASE_GATE"
                  if release == "success"
                  else "product_e2e=NOT_PROVEN"
              )
              print("ga_ready=" + ("true" if release == "success" and not failures else "false"))
          else:
              # 未执行 run_product_tc.py --run：产品 E2E 明确 NOT_RUN，绝不折算为通过。
              print("product_e2e=NOT_RUN")
              print("ga_ready=false")
          if failures:
              print("::error::AIQE 聚合门禁失败: " + ", ".join(failures))
              sys.exit(1)
          print("AIQE 聚合门禁通过：5 个必需 job 全部 success；release_gate 状态见上（skip 不计 PASS）")
          PY
      # 证据清单在 PR 场景也生成，但不要 --require-complete（JUnit 等 artifact 由其他 job 生成）。
      - name: Build evidence manifest (PR / non-release)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python scripts/aiqe/build_evidence_manifest.py \
            --commit-sha "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --environment "ci" \
            --output work-logs/evidence/aiqe-v16/evidence-manifest.json \
            --markdown work-logs/evidence/aiqe-v16/evidence-manifest.md
      - name: Upload evidence manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aiqe-v16-evidence-manifest
          path: |
            work-logs/evidence/aiqe-v16/evidence-manifest.json
            work-logs/evidence/aiqe-v16/evidence-manifest.md
          retention-days: 90
