name: API 回归测试

on:
  schedule:
    - cron: '3 2 * * *'   # 每日 02:03 UTC
  workflow_dispatch:
    inputs:
      env:
        description: '目标环境'
        required: true
        type: choice
        options: [test, prod]
        default: test

jobs:
  api-regression:
    runs-on: [self-hosted, internal-network]
    timeout-minutes: 30
    env:
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
      KIBANA_URL: ${{ secrets.KIBANA_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target env
        id: target
        shell: pwsh
        run: |
          $envName = '${{ inputs.env || ''test'' }}'
          if ($envName -eq 'prod') {
            "base_url=https://api.cameltv.live"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "health_urls=https://www.camel1.tv/,https://api.cameltv.live/" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "login_url=https://api.cameltv.live/account-service/ee/client/demo/login" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "auth_username=${{ secrets.CAMELTV_PROD_USERNAME }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "auth_password=${{ secrets.CAMELTV_PROD_PASSWORD }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "base_url=https://g3-test3.elelive.cn"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "health_urls=https://camelive-g3-test5.elelive.cn/,https://g3-test3.elelive.cn/" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "login_url=https://camel-test5.elelive.cn/account-service/ee/client/demo/login" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "auth_username=${{ secrets.CAMELTV_TEST_USERNAME }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "auth_password=${{ secrets.CAMELTV_TEST_PASSWORD }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          "env_name=$envName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test deps
        run: npm ci
        working-directory: test-platform/tests/api-testing/generated

      - name: Refresh business token
        shell: pwsh
        env:
          CAMELTV_USERNAME: ${{ steps.target.outputs.auth_username }}
          CAMELTV_PASSWORD: ${{ steps.target.outputs.auth_password }}
          CAMELTV_COUNTRY_CODE: '+86'
          CAMELTV_LOGIN_URL: ${{ steps.target.outputs.login_url }}
        run: |
          $token = node tests/automation/ui/utils/fetch-auth-token.cjs
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'business token refresh failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "CAMELTV_AUTH_TOKEN<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $token
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Env Health Check
        shell: pwsh
        run: |
          pwsh scripts/ci/api-regression.ps1 health -BaseUrls "${{ steps.target.outputs.health_urls }}"

      - name: Run API Tests
        shell: pwsh
        run: |
          pwsh scripts/ci/api-regression.ps1 run `
            -BaseUrl "${{ steps.target.outputs.base_url }}" `
            -AuthToken $env:CAMELTV_AUTH_TOKEN `
            -ReportDir "$env:GITHUB_WORKSPACE/artifacts"

      - name: Upload JUnit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-${{ steps.target.outputs.env_name }}-${{ github.run_number }}
          path: artifacts/api-test-junit.xml
          if-no-files-found: warn

      - name: ELK Trace Collection
        if: failure()
        shell: pwsh
        run: |
          pwsh scripts/ci/api-regression.ps1 collect-elk `
            -JunitPath "$env:GITHUB_WORKSPACE/artifacts/api-test-junit.xml" `
            -ElasticUrl $env:ELASTIC_URL `
            -KibanaUrl $env:KIBANA_URL
