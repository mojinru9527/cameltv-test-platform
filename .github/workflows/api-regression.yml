name: API 回归测试

on:
  schedule:
    - cron: '3 2 * * *'   # 每日 02:03 UTC
  workflow_dispatch:
    inputs:
      env:
        description: '目标环境'
        required: true
        type: choice
        options: [test, prod]
        default: test

jobs:
  api-regression:
    runs-on: [self-hosted, internal-network]
    timeout-minutes: 30
    env:
      CAMELTV_TEST_DB_USER: ${{ secrets.CAMELTV_TEST_DB_USER }}
      CAMELTV_TEST_DB_PWD: ${{ secrets.CAMELTV_TEST_DB_PWD }}
      CAMELTV_TEST_REDIS_PWD: ${{ secrets.CAMELTV_TEST_REDIS_PWD }}
      CAMELTV_TEST_MQ_USER: ${{ secrets.CAMELTV_TEST_MQ_USER }}
      CAMELTV_TEST_MQ_PWD: ${{ secrets.CAMELTV_TEST_MQ_PWD }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      ELK_PASSWORD: ${{ secrets.ELK_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd test-platform
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh business token (test5)
        shell: pwsh
        env:
          CAMELTV_USERNAME: ${{ secrets.CAMELTV_TEST_USERNAME }}
          CAMELTV_PASSWORD: ${{ secrets.CAMELTV_TEST_PASSWORD }}
          CAMELTV_COUNTRY_CODE: '+86'
          CAMELTV_LOGIN_URL: https://camel-test5.elelive.cn/account-service/ee/client/demo/login
        run: |
          $token = node tests/automation/ui/utils/fetch-auth-token.cjs
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'test5 token refresh failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "CAMELTV_TEST_AUTH_TOKEN<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $token
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Env Health Check
        run: |
          cd test-platform
          tp envcheck --env ${{ inputs.env || 'test' }}

      - name: Run API Tests
        run: |
          cd test-platform
          tp api run --env ${{ inputs.env || 'test' }} --report data/reports/api-${{ github.run_number }}.xml

      - name: Ingest Report
        if: always()
        run: |
          cd test-platform
          tp report ingest --file data/reports/api-${{ github.run_number }}.xml --build ${{ github.run_number }} --branch main --source api

      - name: ELK Trace Collection
        if: failure()
        run: |
          cd test-platform
          tp logagg batch --env ${{ inputs.env || 'test' }} --report data/reports/api-${{ github.run_number }}.xml --cluster
