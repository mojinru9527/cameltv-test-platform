name: 主干全新检出质量门禁

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: 变更范围识别
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            python scripts/ci/classify_ci_changes.py --files-from "$RUNNER_TEMP/changed-files" --null --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/ci-scope.json"
          else
            python scripts/ci/classify_ci_changes.py --force-all --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/ci-scope.json"
          fi
          {
            echo "### CI scope"
            echo '~~~json'
            cat "$RUNNER_TEMP/ci-scope.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-clean-checkout:
    name: 后端全新检出与全量回归
    needs: detect_changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cameltv
          POSTGRES_PASSWORD: cameltv_test
          POSTGRES_DB: cameltv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DETECT_RESULT: ${{ needs.detect_changes.result }}
      DOMAIN_REQUIRED: ${{ needs.detect_changes.outputs.backend }}
      SCOPE_REASON: ${{ needs.detect_changes.outputs.reason }}
    steps:
      - name: Enforce backend gate result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::CI scope detection failed: $DETECT_RESULT"
            exit 1
          fi
          if [[ "$DOMAIN_REQUIRED" != "true" ]]; then
            echo "Backend full regression skipped: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Backend full regression will run: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt

      - name: Install Dependencies
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 未定义符号检查
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: ruff check app/ --select F821 --output-format=github

      - name: 应用导入冒烟
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: |
          python -c "import app.main; print('import OK: routers/models resolve on clean checkout')"

      - name: Alembic 单头校验
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: |
          heads="$(python -m alembic heads 2>/dev/null | grep -c '(head)')"
          echo "alembic heads = $heads"
          test "$heads" -eq 1

      - name: Alembic revision 长度兼容性
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: python -m pytest tests/test_migration_revision_ids.py -q

      - name: Apply PostgreSQL migrations
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://cameltv:cameltv_test@localhost:5432/cameltv_test
        run: python -m alembic upgrade head

      - name: PostgreSQL concurrency regressions
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://cameltv:cameltv_test@localhost:5432/cameltv_test
          AUTO_CREATE_TABLES: 'false'
          SYNC_ENABLED: 'false'
          BATCH48_RUN_PG_INTEGRATION: '1'
          BATCH48_PG_INTEGRATION_URL: postgresql+psycopg2://cameltv:cameltv_test@localhost:5432/cameltv_test
        run: python -m pytest -q tests/test_batch48_postgresql_concurrency.py

      - name: AITDE Domain Invariants + Reality Gate
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: python -m pytest -q tests/aitde/v39 tests/aitde/reality

      - name: Backend Full Test Suite
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        env:
          BATCH48_RUN_PG_INTEGRATION: '1'
          BATCH48_PG_INTEGRATION_URL: postgresql+psycopg2://cameltv:cameltv_test@localhost:5432/cameltv_test
        run: python -m pytest -q

  frontend-clean-checkout:
    name: 前端全新检出与全量回归
    needs: detect_changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DETECT_RESULT: ${{ needs.detect_changes.result }}
      DOMAIN_REQUIRED: ${{ needs.detect_changes.outputs.frontend }}
      SCOPE_REASON: ${{ needs.detect_changes.outputs.reason }}
    steps:
      - name: Enforce frontend gate result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::CI scope detection failed: $DETECT_RESULT"
            exit 1
          fi
          if [[ "$DOMAIN_REQUIRED" != "true" ]]; then
            echo "Frontend full regression skipped: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Frontend full regression will run: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
          cache-dependency-path: test-platform-v2/frontend/package-lock.json

      - name: Install Dependencies
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        working-directory: test-platform-v2/frontend
        run: npm ci

      - name: Type Check
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        working-directory: test-platform-v2/frontend
        run: npm run typecheck

      - name: Lint
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        working-directory: test-platform-v2/frontend
        run: npm run lint

      - name: Frontend Full Test Suite
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        working-directory: test-platform-v2/frontend
        run: npm test

      - name: Production Build
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        working-directory: test-platform-v2/frontend
        run: npm run build

  aitde-migration-postgres:
    name: AITDE PostgreSQL Migration Drill
    needs: detect_changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cameltv
          POSTGRES_PASSWORD: cameltv_test
          POSTGRES_DB: cameltv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DETECT_RESULT: ${{ needs.detect_changes.result }}
      DOMAIN_REQUIRED: ${{ needs.detect_changes.outputs.backend }}
      SCOPE_REASON: ${{ needs.detect_changes.outputs.reason }}
    steps:
      - name: Enforce backend gate result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::CI scope detection failed: $DETECT_RESULT"
            exit 1
          fi
          if [[ "$DOMAIN_REQUIRED" != "true" ]]; then
            echo "AITDE migration drill skipped: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Checkout
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt

      - name: Install Dependencies
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: PostgreSQL previous-head <-> current-head reversibility drill
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://cameltv:cameltv_test@localhost:5432/cameltv_test
        run: python -m pytest -q tests/aitde/v39/test_migration_drill_reversible.py

  aitde-data-integration:
    name: AITDE Data Runtime Integration
    needs: detect_changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DETECT_RESULT: ${{ needs.detect_changes.result }}
      DOMAIN_REQUIRED: ${{ needs.detect_changes.outputs.backend }}
      SCOPE_REASON: ${{ needs.detect_changes.outputs.reason }}
    steps:
      - name: Enforce backend gate result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::CI scope detection failed: $DETECT_RESULT"
            exit 1
          fi
          [[ "$DOMAIN_REQUIRED" == "true" ]] || { echo "data-integration skipped: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }

      - name: Checkout
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt

      - name: Install Dependencies
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Real DB driver / executor + data runtime integration
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: python -m pytest -q tests/aitde/reality/test_db_driver.py tests/aitde/reality/test_db_executor.py tests/aitde/reality/test_existing_executor.py tests/aitde/reality/test_api_executor.py tests/aitde/reality/test_data_plan_executor.py tests/aitde/v32

  aitde-security-redteam:
    name: AITDE Security Red-Team (SecretRef / Evidence / Sanitizer)
    needs: detect_changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DETECT_RESULT: ${{ needs.detect_changes.result }}
      DOMAIN_REQUIRED: ${{ needs.detect_changes.outputs.backend }}
      SCOPE_REASON: ${{ needs.detect_changes.outputs.reason }}
    steps:
      - name: Enforce backend gate result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::CI scope detection failed: $DETECT_RESULT"
            exit 1
          fi
          [[ "$DOMAIN_REQUIRED" == "true" ]] || { echo "security-redteam skipped: $SCOPE_REASON" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }

      - name: Checkout
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test-platform-v2/backend/requirements.txt

      - name: Install Dependencies
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Secret-ref-only / evidence integrity / snapshot sanitizer
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        working-directory: test-platform-v2/backend
        run: python -m pytest -q tests/aitde/v31/test_evidence_sanitizer.py tests/aitde/v34/test_secret_redaction.py tests/aitde/reality/test_evidence_integrity.py tests/aitde/v31/test_environment_snapshot.py tests/aitde/v32/test_db_snapshot.py
