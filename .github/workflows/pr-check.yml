name: 每日质量观察

on:
  schedule:
    - cron: '0 4 * * *'   # 每日 04:00 UTC（12:00 北京时间），观察项：覆盖率/PG/a11y/lint
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: 变更范围识别
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            python scripts/ci/classify_ci_changes.py --files-from "$RUNNER_TEMP/changed-files" --null --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/ci-scope.json"
          else
            python scripts/ci/classify_ci_changes.py --force-all --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/ci-scope.json"
          fi
          {
            echo "### Extended CI scope"
            echo '~~~json'
            cat "$RUNNER_TEMP/ci-scope.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-check:
    name: 后端观察（ruff/mypy/覆盖率）
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: test-platform-v2/backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Lint (ruff)
        working-directory: test-platform-v2/backend
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app/ --output-format=github || echo "::warning::ruff 检查发现问题"

      - name: Type Check (mypy)
        working-directory: test-platform-v2/backend
        continue-on-error: true
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --no-error-summary || echo "::warning::mypy 类型检查发现问题"

      # D4: pytest with coverage. --cov-fail-under=70 is a soft gate (continue-on-error).
      - name: Unit Tests + Coverage (pytest)
        working-directory: test-platform-v2/backend
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term --cov-report=json \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: test-platform-v2/backend/coverage.json
          retention-days: 7

  backend-check-pg:
    name: 后端观察（PostgreSQL 兼容性）
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testplatform
          POSTGRES_PASSWORD: testplatform_test
          POSTGRES_DB: testplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: test-platform-v2/backend
        # 与生产 Dockerfile 同源（--require-hashes 安装 lock 锁定版本），
        # 避免 requirements.txt 未锁定版本与生产行为漂移导致观察假绿
        # （如 sqlalchemy 2.0.51→2.0.52 布尔 server_default 渲染差异）。
        run: |
          pip install --require-hashes -r requirements.lock

      - name: Verify Alembic migrations on PostgreSQL
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://testplatform:testplatform_test@localhost:5432/testplatform_test
        run: |
          alembic upgrade head
          echo "✅ Alembic migrations applied successfully on PostgreSQL"

      - name: Verify model import on PostgreSQL
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://testplatform:testplatform_test@localhost:5432/testplatform_test
          AUTO_CREATE_TABLES: 'false'
        run: |
          python -c "
          from app.main import app
          from app.core.db import engine, Base
          # Verify all models are importable and tables exist
          tables = Base.metadata.tables.keys()
          print(f'✅ {len(tables)} tables registered: {\", \".join(sorted(tables))}')
          assert len(tables) >= 30, f'Expected >=30 tables, got {len(tables)}'
          "

      - name: PostgreSQL concurrency regressions
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://testplatform:testplatform_test@localhost:5432/testplatform_test
          AUTO_CREATE_TABLES: 'false'
          SYNC_ENABLED: 'false'
          BATCH48_RUN_PG_INTEGRATION: '1'
          BATCH48_PG_INTEGRATION_URL: postgresql+psycopg2://testplatform:testplatform_test@localhost:5432/testplatform_test
        run: python -m pytest -q tests/test_batch48_postgresql_concurrency.py

      # D5: Detect schema drift between ORM models and Alembic migrations.
      # Runs on the same PG service — drops tables between steps so they don't
      # interfere. Non-blocking (continue-on-error).
      - name: Check Model-Migration Drift (D5)
        working-directory: test-platform-v2/backend
        env:
          DATABASE_URL: postgresql://testplatform:testplatform_test@localhost:5432/testplatform_test
        continue-on-error: true
        run: |
          python scripts/check_migration_drift.py

  frontend-a11y:
    name: 前端观察（a11y 可访问性）
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'

      - name: Install Dependencies
        working-directory: test-platform-v2/frontend
        run: npm ci

      - name: Build
        working-directory: test-platform-v2/frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: test-platform-v2/frontend
        run: npx playwright install --with-deps chromium

      - name: A11y Scan
        working-directory: test-platform-v2/frontend
        run: npm run test:a11y:ci

      - name: Upload A11y Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: |
            test-platform-v2/frontend/playwright-report/
            test-platform-v2/frontend/test-results/
          retention-days: 7

  frontend-check:
    name: 前端观察（tsc/lint/覆盖率）
    needs: detect_changes
    if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'

      - name: Install Dependencies
        working-directory: test-platform-v2/frontend
        run: npm ci

      - name: Type Check (tsc)
        working-directory: test-platform-v2/frontend
        run: npm run typecheck

      - name: Lint
        working-directory: test-platform-v2/frontend
        run: npm run lint

      # D4: Vitest coverage uses the committed Batch 58 baseline as a hard
      # non-regression floor. Raising the floor remains a separate tested change.
      - name: Unit Tests + Coverage
        working-directory: test-platform-v2/frontend
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: test-platform-v2/frontend/coverage/
          retention-days: 7
