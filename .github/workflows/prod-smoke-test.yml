name: 正式环境冒烟测试

on:
  schedule:
    - cron: '7 8 * * *'   # 每日 08:07 UTC
  workflow_dispatch:

jobs:
  prod-smoke:
    runs-on: [self-hosted, internal-network]
    timeout-minutes: 15
    env:
      VPN_TUN_ADDR: ${{ secrets.VPN_TUN_ADDR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd test-platform
          pip install -r requirements.txt
          pip install -e .

      - name: Refresh business token (prod)
        shell: pwsh
        working-directory: tests/automation/ui
        env:
          CAMELTV_USERNAME: ${{ secrets.CAMELTV_PROD_USERNAME }}
          CAMELTV_PASSWORD: ${{ secrets.CAMELTV_PROD_PASSWORD }}
          CAMELTV_COUNTRY_CODE: '+86'
          CAMELTV_BASE_URL: https://www.camel1.tv/
        run: |
          npm ci
          npx playwright install chromium
          $token = node utils/fetch-auth-token.cjs
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'prod token refresh failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "CAMELTV_PROD_AUTH_TOKEN<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $token
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Verify VPN Connection
        run: |
          cd test-platform
          tp config show --env prod
        # vpn07 不通会直接 fail fast (vpn07_check)

      - name: Run Smoke Tests
        run: |
          cd test-platform
          tp api run --env prod --filter smoke --report data/reports/prod-smoke-${{ github.run_number }}.xml

      - name: Ingest Report
        if: always()
        run: |
          cd test-platform
          tp report ingest --file data/reports/prod-smoke-${{ github.run_number }}.xml --build ${{ github.run_number }} --branch main --source api
