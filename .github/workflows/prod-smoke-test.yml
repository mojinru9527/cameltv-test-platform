name: 正式环境冒烟测试

on:
  schedule:
    - cron: '7 8 * * *'   # 每日 08:07 UTC
  workflow_dispatch:

jobs:
  prod-smoke:
    runs-on: [self-hosted, internal-network]
    timeout-minutes: 15
    env:
      VPN_TUN_ADDR: ${{ secrets.VPN_TUN_ADDR }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
      ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
      KIBANA_URL: ${{ secrets.KIBANA_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify VPN + prod reachability
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VPN_TUN_ADDR)) { throw 'VPN_TUN_ADDR missing (vpn07 未配置)' }
          pwsh scripts/ci/api-regression.ps1 health -BaseUrls "https://www.camel1.tv/,https://api.cameltv.live/"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test deps
        run: npm ci
        working-directory: tests/api-testing/generated

      - name: Refresh business token (prod)
        shell: pwsh
        env:
          CAMELTV_USERNAME: ${{ secrets.CAMELTV_PROD_USERNAME }}
          CAMELTV_PASSWORD: ${{ secrets.CAMELTV_PROD_PASSWORD }}
          CAMELTV_COUNTRY_CODE: '+86'
          CAMELTV_LOGIN_URL: https://api.cameltv.live/account-service/ee/client/demo/login
        run: |
          $token = node tests/automation/ui/utils/fetch-auth-token.cjs
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'prod token refresh failed' }
          Add-Content -Path $env:GITHUB_ENV -Value "CAMELTV_AUTH_TOKEN<<EOF"
          Add-Content -Path $env:GITHUB_ENV -Value $token
          Add-Content -Path $env:GITHUB_ENV -Value "EOF"

      - name: Run Production Smoke (read-only API specs)
        shell: pwsh
        run: |
          pwsh scripts/ci/api-regression.ps1 run `
            -BaseUrl "https://api.cameltv.live" `
            -AuthToken $env:CAMELTV_AUTH_TOKEN `
            -ReportDir "$env:GITHUB_WORKSPACE/artifacts"

      - name: Upload JUnit Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-${{ github.run_number }}
          path: artifacts/api-test-junit.xml
          if-no-files-found: warn

      - name: ELK Trace Collection
        if: failure()
        shell: pwsh
        run: |
          pwsh scripts/ci/api-regression.ps1 collect-elk `
            -JunitPath "$env:GITHUB_WORKSPACE/artifacts/api-test-junit.xml" `
            -ElasticUrl $env:ELASTIC_URL `
            -KibanaUrl $env:KIBANA_URL
