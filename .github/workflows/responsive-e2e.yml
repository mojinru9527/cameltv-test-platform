name: 响应式回归 E2E（tablet/mobile 常驻）

on:
  schedule:
    - cron: '30 1 * * *'   # 每日 01:30 UTC（09:30 北京时间）
  workflow_dispatch:

jobs:
  responsive-e2e:
    name: 双视口响应式回归
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USERNAME: tester
      E2E_PASSWORD: ResponsiveE2e#2026
      TESTER_PASSWORD: ResponsiveE2e#2026
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test-platform-v2/frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd test-platform-v2/backend
          pip install -r requirements.txt

      - name: Start backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./data/ci-responsive.db
          ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ResponsiveAdmin#2026
          TESTER_USERNAME: tester
          TESTER_PASSWORD: ResponsiveE2e#2026
          AUTO_CREATE_TABLES: 'true'
        run: |
          cd test-platform-v2/backend
          mkdir -p data
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > data/ci-backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/open/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "backend failed to start" >&2
          tail -n 50 data/ci-backend.log >&2
          exit 1

      - name: Install frontend deps + Playwright
        run: |
          cd test-platform-v2/frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start frontend
        run: |
          cd test-platform-v2/frontend
          nohup npm run dev -- --port 5173 --strictPort > vite-ci.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "frontend failed to start" >&2
          tail -n 50 vite-ci.log >&2
          exit 1

      - name: Run responsive e2e
        env:
          BASE_URL: http://localhost:5173
        run: |
          cd test-platform-v2/frontend
          npx playwright test e2e/batch89-responsive.spec.ts --reporter=list

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-e2e-evidence
          path: |
            test-platform-v2/work-logs/evidence/batch-89/responsive/
            test-platform-v2/frontend/test-results/
          if-no-files-found: warn
