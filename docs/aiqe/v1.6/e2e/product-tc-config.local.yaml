# 产品级 TC 本地 rehearsal 配置（隔离本地 Test 环境）
#
# 用途：验证 `run_product_tc.py` 执行链路、隔离环境可启动、per-TC runner 可运行。
# 注意：本地环境没有 CamelTv 业务 API/UI/MySQL/真机，所有 TC 输出 **BLOCKED**；
# 官方产品验收仍应使用 `product-tc-config.yaml` + 真实隔离 Test 业务环境。
schema_version: "1.0"
environment: "local-rehearsal"
required_env:
  - AIQE_TEST_BASE_URL
  - AIQE_TEST_ADMIN_URL
  - AIQE_TEST_DB_READONLY_DSN
  - AIQE_TEST_ADMIN_PASSWORD
test_cases:
  - tc_id: TC-AIQE-001
    title: "需求契约冻结 + 需求变更影响（本地 API rehearsal）"
    spec_ref: "merged-spec §20 TC-AIQE-001"
    runner: ["python", "scripts/aiqe/per_tc/product_tc_local_runner.py", "--tc", "TC-AIQE-001"]
    evidence_glob: "work-logs/evidence/aiqe-v16/local-test/**"
    blocked_by: "需要 PRD 导入 + 后台人工确认；本地仅跑通 Contract API 部分"
  - tc_id: TC-AIQE-002
    title: "API → Admin UI → Public API → DB 的统一 Run（本地平台 Run rehearsal）"
    spec_ref: "merged-spec §20 TC-AIQE-002"
    runner: ["python", "scripts/aiqe/per_tc/product_tc_local_runner.py", "--tc", "TC-AIQE-002"]
    evidence_glob: "work-logs/evidence/aiqe-v16/local-test/**"
    blocked_by: "需要业务 API/后台 UI/前台 UI/MySQL；本地仅跑通平台 HTTP Run"
