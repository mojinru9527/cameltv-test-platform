      - AIQE_TEST_ADMIN_PASSWORD
      - AIQE_TEST_DB_READONLY_DSN
    preconditions:
      - admin-ui-and-public-api-reachable
      - isolated-fixture-article-cleanup
    required_assertions:
      - admin.create_article_ok
      - business.status_published
      - db.readonly_row_matches
      - public_api.returns_article
      - public_ui.renders_title
    required_artifacts:
      - execution-trace
      - assertion-report
      - db-readonly-snapshot
    timeout_seconds: 900
    runner: null
    blocked_status: "BLOCKED"
    blocked_by: "需要隔离 Test 后台 UI/公开 API/只读 DB 与唯一 Fixture 模板；当前无可用业务环境"
    owner: "qa-automation"
    unblock_action: "接入隔离 Test 环境与只读 DSN，实现 tc_002_admin_publish_chain.py，并以同一 Run 串联后台写入/DB 只读/前台读取；由 FIX-004 交付"
