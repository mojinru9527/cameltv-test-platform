# V1.6.2 产品级 TC 执行配置（TC-AIQE-001..010）
#
# 本文件是产品 TC 的唯一执行计划与基线声明（schema 2.0）：
# - baseline_version 必须与 docs/aiqe/v1.6/e2e/product-results.json、release-verdict
#   使用的基线一致；旧基线执行结果不得自动继承。
# - 映射关系见 docs/adr/0032-aiqe-v16-product-tc-baseline-mapping.md（状态 PENDING，
#   在批准前本基线的产品 TC 只能是 BLOCKED/NOT_PROVEN，不得作为 GA 证据）。
# - runner: null 表示当前没有受批准的隔离 Test 产品 Runner，必须写清
#   blocked_by / owner / unblock_action / blocked_status: BLOCKED；无解释的 null 不被接受。
# - 当前没有隔离 Test 业务环境，因此 10 条 TC 全部显式 BLOCKED。真实 Runner 必须从
#   正式入口（REST API / Worker / 外部 Runner）执行，并按
#   scripts/aiqe/per_tc/runner_contract.py 的合同写出 execution/assertions/artifacts。
# - 外部生产站点 Playwright 手工脚本、半自动截图、Service 直调都不得登记为 PASS Runner。
#
# runner 调用约定（由 run_product_tc.py --run 注入）：
#   AIQE_TC_RESULT_PATH / AIQE_TC_ID / AIQE_TC_ROOT / AIQE_TESTED_COMMIT_SHA /
#   AIQE_TC_ENVIRONMENT / AIQE_AIQE_SCRIPTS_DIR
schema_version: "2.0"
baseline_version: "v1.6.2-hardening"
environment: "isolated-test"
adr_ref: "docs/adr/0032-aiqe-v16-product-tc-baseline-mapping.md"
adr_approval_status: "PENDING"
required_env:
  - AIQE_TEST_BASE_URL
  - AIQE_TEST_ADMIN_URL
  - AIQE_TEST_DB_READONLY_DSN
test_cases:
  - tc_id: TC-AIQE-001
    title: "需求契约冻结与需求变更影响（V1 checksum 稳定、V2 差异可见）"
    spec_ref: "merged-spec §20 TC-AIQE-001 / 整改手册 §5.1"
    baseline_version: "v1.6.2-hardening"
    required_environment: "isolated-test"
    required_secrets:
      - AIQE_TEST_ADMIN_USERNAME
      - AIQE_TEST_ADMIN_PASSWORD
    preconditions:
      - aiqe-test-tenant-provisioned
      - requirement-contract-api-reachable
    required_assertions:
      - contract.v1_checksum_stable
      - contract.v2_checksum_differs
      - contract.change_impact_listed
      - contract.cases_marked_re_review
    required_artifacts:
      - contract-snapshot
      - assertion-report
      - execution-trace
    timeout_seconds: 900
    runner: null
    blocked_status: "BLOCKED"
    blocked_by: "尚无隔离 Test 业务环境与受批准 Runner；旧生产站点脚本不得登记为产品 Runner"
    owner: "qa-automation"
    unblock_action: "接入隔离 Test 租户 + 实现 scripts/aiqe/per_tc/tc_001_contract_chain.py（正式 Contract API → 版本冻结 → V2 影响）；由 FIX-004 交付"
    evidence_glob: "docs/aiqe/v1.6/evidence/product/TC-AIQE-001/**"

