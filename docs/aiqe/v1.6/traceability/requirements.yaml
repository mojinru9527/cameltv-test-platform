  # ── V16-002 浏览器全请求链（P0）────────────────────────────
  - id: V16-002-R1
    issue: V16-002
    priority: P0
    title: "应用层导航预校验 + 浏览器层 route 全请求拦截"
    requirement: "PlaywrightDriver 必须接收服务端 ResolvedExecutionPolicy；主页面/导航 URL 在任何浏览器动作前校验；context.route 必须在任何 Page 创建前安装，覆盖 iframe/XHR/fetch/图片/脚本。"
    invariant: "缺失 ALLOW 策略不得启动浏览器；未授权子资源请求不得抵达目标服务器。"
    status: VERIFIED
    code:
      - path: test-platform-v2/backend/app/aiqe/drivers/playwright_driver.py
        symbol: "_prevalidate_targets / _install_request_guards / _on_route"
        change: modified
    production_entry:
      - "node_executor.execute_node -> _execute_playwright -> PlaywrightDriver.execute"
      - "scripts/qa/aiqe_local_runner.py -> node_executor.execute_node"
    tests:
      success:
        - tests/test_aiqe_v16_002_playwright_interception.py::test_allowed_navigation_loads_page_and_subresources
      negative:
        - tests/test_aiqe_v16_002_playwright_interception.py::test_main_navigation_outside_policy_blocked_before_browser_starts
        - tests/test_aiqe_v16_002_playwright_interception.py::test_subresource_requests_to_denied_target_blocked
      boundary:
