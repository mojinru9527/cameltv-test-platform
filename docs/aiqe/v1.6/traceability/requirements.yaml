    tests:
      success:
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_worker_allows_authorized_target_and_persists_policy_evidence
      negative:
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_worker_blocks_run_without_policy_record
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_worker_blocks_when_policy_record_removed_before_claim
