    mock_boundary: "真实 Chromium 149 + 本地受控 HTTP/WS 目标服务器；route/驱动链路未 Mock。"
    layers: [L2, L3]
    evidence:
      - "commit:6eeb7b316"
      - "pytest:tests/test_aiqe_v16_002_playwright_interception.py (10 passed)"
    owner: driver-device
    reviewer: pending
    gaps: []

