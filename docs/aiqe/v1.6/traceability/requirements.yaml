  - id: V16-001-R1
    issue: V16-001
    priority: P0
    title: "策略四态决策与不可变授权快照"
    requirement: "TargetPolicyResolver 必须返回显式 PolicyDecision(ALLOW/DENY/UNAVAILABLE/MISSING_BINDING) 与不可变 ResolvedExecutionPolicy，禁止用 bool 表达策略存在性。"
    invariant: "只有 decision=ALLOW 才允许创建 Driver 或发起网络/数据库动作；其余决策一律 BLOCKED。"
    status: VERIFIED
    code:
      - path: test-platform-v2/backend/app/aiqe/security/target_policy.py
        symbol: "PolicyDecision / ResolvedExecutionPolicy / resolve_execution_policy"
        change: modified
    production_entry:
      - "job_consumer.run_job -> execution_service.execute_inprocess_job -> resolve_execution_policy"
      - "GET /api/v1/execution-jobs/{job_id}/payload -> policy_gate_for_external_runner"
    tests:
      success:
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_policy_decision_four_states
      negative:
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_worker_blocks_run_without_environment_and_never_reaches_target
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_worker_blocks_when_policy_resolver_raises
      boundary:
        - tests/test_aiqe_v16_001_policy_fail_closed.py::test_expired_policy_blocks_node_execution
    mock_boundary: "真实 SQLite 会话 + 真实本地 ThreadingHTTPServer 目标；策略解析/Job/Worker 链路未 Mock。"
    layers: [L1, L2, L3]
    evidence:
      - "commit:09140401f"
      - "pytest:tests/test_aiqe_v16_001_policy_fail_closed.py (25 passed)"
    owner: backend-security
    reviewer: pending
    gaps: []

