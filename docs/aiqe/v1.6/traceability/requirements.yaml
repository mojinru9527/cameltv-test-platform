        symbol: "_block_node_for_policy / execute_inprocess_job"
        change: modified
      - path: test-platform-v2/backend/app/aiqe/services/node_executor.py
        symbol: "execute_node(policy_context=...) / _policy_denial"
        change: modified
    production_entry:
