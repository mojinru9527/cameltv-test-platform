# CamelTv AIQE V1.6 追踪矩阵（v2.0）
#
# 状态语义：NOT_STARTED < PARTIAL < IMPLEMENTED < VERIFIED（交付/自动证据）；
# ACCEPTED 需非原作者独立 Reviewer 签署，且 acceptance.status=REVIEWED。
# VERIFIED 不等于独立验收：acceptance.status 为 NOT_REVIEWED 时 Gate G 不得宣称完成。
# 运行时证据必须有可校验的机器产物；仅有现场记录时 runtime_evidence.status=NOT_PROVEN。
# 本文件由人工维护，机器校验见 scripts/aiqe/check_traceability.py。

