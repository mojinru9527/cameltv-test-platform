[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "alembic/versions/*",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "RUF001",  # ambiguous unicode character in string (Chinese copy)
    "RUF002",  # ambiguous unicode character in docstring (Chinese docs)
    "RUF003",  # ambiguous unicode character in comment (Chinese comments)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# V39-003 / C243-4 — Backend mypy ratchet（required check）。
#
# 历史 ORM 类型硬墙仍存在，因此不强行清零；`quality-ratchet-baseline.json`
# 记录当前完整发现的精确集合，CI 对 Ruff/mypy 执行「只减不增」：
# 新增任何 finding 都会阻断。历史豁免趋势也继续记录在
# docs/aitde/validation/V3.9_mypy_exemption_list.md。
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
error_summary = true
warn_unused_ignores = false
