[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks unit-level tests
    api: marks API integration tests
    service: marks service integration tests
    worker: marks Worker/Job E2E tests
    browser: marks real Chromium browser tests
    device: marks real device/emulator tests
    e2e: marks full runtime E2E tests
    security: marks security negative tests
    migration: marks migration/roundtrip tests
