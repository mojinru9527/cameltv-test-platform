# AITDE V3.4 Durable Runtime — Temporal Server 本地部署（test 环境）
#
# 手动起 Temporal（独立于主 app compose，避免污染主部署）：
#   docker compose -f docker-compose.yml up -d
# 关闭：
#   docker compose -f docker-compose.yml down
#
# 依赖真实基础设施（V34-001）：
#   - namespace / persistence / visibility：`temporalio/auto-setup` 自动建表
#     （SQLite 持久化 + SQLite visibility，够本地/单机 test；生产切 Postgres+ES）
#   - mTLS：默认关闭；开启见 scripts/gen-certs.sh + README「mTLS」段
#
# 注意：此处是 Temporal *Server*（控制面推进器）；真正的执行 Worker 是
# backend 侧的 `run_worker`（app/modules/aitde/workflow/gateway.py），需在
# 有 backend 镜像的机器上启动（见 scripts/start-worker.sh）。
services:
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: aitde-temporal
    command:
      - auto-setup
    environment:
      - DB=sqlite
      - NAMESPACE=${TEMPORAL_NAMESPACE:-default}
      - TEMPORAL_COMPOSE_SCHEMA=1
      # Web UI
      - ENABLE_UI=true
      - TEMPORAL_ADDRESS=${TEMPORAL_GRPC_ENDPOINT:-127.0.0.1:7233}
      - UI_PORT=8080
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_WEB_PORT=8080
      # mTLS（默认 OFF；开启见 gen-certs.sh）
      - TLS_ENABLED=${TEMPORAL_TLS_ENABLED:-false}
      - TLS_CA_FILE=${TEMPORAL_TLS_CA_PATH:-}
      - TLS_CERT_FILE=${TEMPORAL_TLS_CERT_PATH:-}
      - TLS_KEY_FILE=${TEMPORAL_TLS_KEY_PATH:-}
      # 持久化 / visibility（SQLite 本地，单机）
      - SQLITE_PLUGIN_DIR=/etc/temporal/plugins
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"   # gRPC (SDK client)
      - "${TEMPORAL_UI_PORT:-8080}:8080"     # Temporal Web UI
    volumes:
      - temporal-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  temporal-data:
    driver: local
