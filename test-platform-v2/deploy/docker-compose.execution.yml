# Opt-in only after the complete image set and rollback have been validated.
# docker compose -f docker-compose.yml -f docker-compose.execution.yml ...
# Required memory values must be established from measured workloads.
services:
  backend:
    image: ${API_IMAGE:?API_IMAGE is required}
    build:
      target: api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WORKER_EXECUTION_ENABLED: "false"
      RUNNER_HTTP_URL: http://runner:8000
      AI_GATEWAY_URL: http://ai-gateway:8100
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?AI_GATEWAY_TOKEN is required}
      AI_GATEWAY_ROLE: remote
      # P1-8：Job 回收重试上限（认领 API 在本服务；到顶即 failed 终态，不再无限重排）。
      AI_JOB_MAX_ATTEMPTS: ${AI_JOB_MAX_ATTEMPTS:-3}
      # P1-9：入库 → 变更检测 → 自动 Agent（出网 LLM）的显式 opt-in，默认关。
      KNOWLEDGE_AUTO_AGENT_ENABLED: ${KNOWLEDGE_AUTO_AGENT_ENABLED:-false}
    depends_on:
      runner:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    volumes:
      - tp-generated-specs:/app/tests/playwright/specs/generated
      - tp-generated-jobs:/app/tests/playwright/generated
    init: true
    mem_limit: ${API_MEMORY_LIMIT:?API_MEMORY_LIMIT is required}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  ai-gateway:
    extends:
      file: docker-compose.yml
      service: backend
    image: ${AI_GATEWAY_IMAGE:?AI_GATEWAY_IMAGE is required}
    build:
      target: ai-gateway
    command: ["uvicorn", "app.ai_gateway_app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      AI_GATEWAY_ROLE: gateway
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?AI_GATEWAY_TOKEN is required}
      # P1-6：ai-gateway 是全部委派 LLM 调用的唯一咽喉，配额闸门在这里兜底；
      # 显式声明便于在 split 拓扑下单独调整（backend / runner 继承同一组默认值）。
      AI_GUARD_ENABLED: ${AI_GUARD_ENABLED:-true}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-60}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-2000000}
      WORKER_EXECUTION_ENABLED: "false"
    expose:
      - "8100"
    init: true
    mem_limit: ${AI_GATEWAY_MEMORY_LIMIT:?AI_GATEWAY_MEMORY_LIMIT is required}
    pids_limit: 128
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/internal/ai/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  runner:
    extends:
      file: docker-compose.yml
      service: backend
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE is required}
    build:
      target: runner
    environment:
      WORKER_EXECUTION_ENABLED: "true"
      AI_GATEWAY_URL: http://ai-gateway:8100
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?AI_GATEWAY_TOKEN is required}
      AI_GATEWAY_ROLE: remote
      DSH_RUNTIME: ${DSH_RUNTIME:-node}
      HEAVY_TASK_BUDGET_ENABLED: "true"
      HEAVY_TASK_BUDGET_CAPACITY: "1"
      ORCHESTRATION_BUDGET_CAPACITY: "1"
      HEAVY_TASK_BUDGET_DIR: /app/storage/resource-budget
      KNOWLEDGE_EMBEDDING_SCHEDULE_ENABLED: ${KNOWLEDGE_EMBEDDING_SCHEDULE_ENABLED:-false}
      # P1-9：UI 执行失败 → 入库 → 变更检测 → 自动 Agent 这条链路的入口在 runner 进程
      # （playwright_executor），必须和 backend 用同一个 opt-in 开关，否则关不干净。
      KNOWLEDGE_AUTO_AGENT_ENABLED: ${KNOWLEDGE_AUTO_AGENT_ENABLED:-false}
    volumes:
      - tp-generated-specs:/app/tests/playwright/specs/generated
      - tp-generated-jobs:/app/tests/playwright/generated
    init: true
    mem_limit: ${RUNNER_MEMORY_LIMIT:?RUNNER_MEMORY_LIMIT is required}
    pids_limit: 256
    stop_grace_period: 60s

  # Temporal retains its own gateway process, sharing browser admission with
  # runner. It must never inherit the lightweight API build target.
  aitde-worker:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE is required}
    build:
      target: runner
    environment:
      WORKER_EXECUTION_ENABLED: "true"
      AI_GATEWAY_URL: http://ai-gateway:8100
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?AI_GATEWAY_TOKEN is required}
      AI_GATEWAY_ROLE: remote
      # 凭据最小化（P0-4）：本服务 WORKER_EXECUTION_ENABLED=true，会在进程内派生
      # DSH 子进程，因此必须持有 DSH Key。这里必须**显式重复**声明：
      # 本覆盖文件用 mapping 形式重写 environment，实测会把主 compose 里
      # `- DSH_API_KEY=` 那条 list 形式条目挤掉（`docker compose config` 渲染结果
      # 里 aitde-worker 拿不到该变量）——这正是 scripts/ops/verify-credential-isolation.py
      # 用来兜底的场景。
      DSH_API_KEY: ${DSH_API_KEY:-}
      HEAVY_TASK_BUDGET_ENABLED: "true"
      HEAVY_TASK_BUDGET_CAPACITY: "1"
      ORCHESTRATION_BUDGET_CAPACITY: "1"
      HEAVY_TASK_BUDGET_DIR: /app/storage/resource-budget
    volumes:
      - tp-generated-specs:/app/tests/playwright/specs/generated
      - tp-generated-jobs:/app/tests/playwright/generated
    mem_limit: ${TEMPORAL_WORKER_MEMORY_LIMIT:?TEMPORAL_WORKER_MEMORY_LIMIT is required}
    pids_limit: 256

  volume-permissions:
    image: ${API_IMAGE:?API_IMAGE is required}
    build:
      target: api
    command: ["sh", "-c", "chown -R 10001:10001 /data /app/storage /app/tests/playwright/specs/generated /app/tests/playwright/generated"]
    volumes:
      - tp-generated-specs:/app/tests/playwright/specs/generated
      - tp-generated-jobs:/app/tests/playwright/generated

volumes:
  tp-generated-specs:
    driver: local
  tp-generated-jobs:
    driver: local

