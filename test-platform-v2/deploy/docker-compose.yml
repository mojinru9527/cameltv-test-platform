# CamelTv 测试平台 v2 — 一键部署（前端 + 后端 + 可选 PostgreSQL）
# 用法: docker-compose up -d  → 访问 http://localhost
# PostgreSQL: 在 .env 中设置 DATABASE_URL，并由密码管理器注入数据库密码。
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cameltv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cameltv}
    volumes:
      - pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cameltv}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: test-platform-v2/backend/Dockerfile
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT is required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - TESTER_USERNAME=${TESTER_USERNAME:-tester}
      - TESTER_PASSWORD=${TESTER_PASSWORD:?TESTER_PASSWORD is required}
      - COOKIE_SECURE=${COOKIE_SECURE:?COOKIE_SECURE is required}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_PATH=${COOKIE_PATH:-/api}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - AUTO_CREATE_TABLES=false
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - ELK_BASE_URL=${ELK_BASE_URL:-}
      - ELK_INDEX=${ELK_INDEX:-*}
      # ── AI / LLM ──
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-https://api.deepseek.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-8192}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.3}
      # ── 蓝湖自动登录 ──
      - LANHU_COOKIE=${LANHU_COOKIE:-}
      - LANHU_USERNAME=${LANHU_USERNAME:-}
      - LANHU_PASSWORD=${LANHU_PASSWORD:-}
      - WORKSPACE_ROOT=/app
      - LANHU_MCP_DIR=/app/lanhu-mcp
      - DATA_DIR=/app/storage/lanhu-data
      # ── 知识库 / RAG / Wiki 功能开关 ──
      - KNOWLEDGE_INGEST_ENABLED=${KNOWLEDGE_INGEST_ENABLED:-true}
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - KNOWLEDGE_GRAPH_ENABLED=${KNOWLEDGE_GRAPH_ENABLED:-true}
      - WIKI_ENABLED=${WIKI_ENABLED:-true}
      - WIKI_AUTO_INGEST_ENABLED=${WIKI_AUTO_INGEST_ENABLED:-true}
      - WIKI_DIFF_ENABLED=${WIKI_DIFF_ENABLED:-true}
      - KNOWLEDGE_INGEST_PRODUCTION_DATA=${KNOWLEDGE_INGEST_PRODUCTION_DATA:-false}
      - LANHU_MCP_ENABLED=${LANHU_MCP_ENABLED:-true}
      - EMBEDDING_CACHE_DIR=${EMBEDDING_CACHE_DIR:-/data/models/fastembed}
      # ── 蓝湖证据包 OCR ──
      - LANHU_EVIDENCE_ENABLED=${LANHU_EVIDENCE_ENABLED:-true}
      - LANHU_OCR_PROVIDER=${LANHU_OCR_PROVIDER:-local}
      # ── SMTP（可选）──
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    volumes:
      - tp-data:/data
      - tp-artifacts:/app/storage
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  volume-permissions:
    build:
      context: ../..
      dockerfile: test-platform-v2/backend/Dockerfile
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /data /app/storage
    volumes:
      - tp-data:/data
      - tp-artifacts:/app/storage
    restart: "no"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_ICP_NUMBER: ${VITE_ICP_NUMBER:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tp-data:
    driver: local
  tp-artifacts:
    driver: local
  pg-data:
    driver: local
