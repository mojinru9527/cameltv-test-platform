# CamelTv 测试平台 v2 — 一键部署（前端 + 后端 + 可选 PostgreSQL）
# 用法: docker-compose up -d  → 访问 http://localhost
# PostgreSQL: 在 .env 中设置 DATABASE_URL，并由密码管理器注入数据库密码。
#
# 平台简化批次：ai-gateway 独立服务与 aitde-worker 已删除（AI 走平台直连，
# AI_API_KEY 由 backend 持有；执行走本地节点 cameltv-node + runner）。
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cameltv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cameltv}
    volumes:
      - pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cameltv}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${API_IMAGE:-cameltv-tp-api:latest}
    build:
      context: ../..
      dockerfile: test-platform-v2/backend/Dockerfile
      target: api
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT is required}
      - RUNNER_HTTP_URL=${RUNNER_HTTP_URL:-http://runner:8000}
      - WORKER_EXECUTION_ENABLED=${WORKER_EXECUTION_ENABLED:-false}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - TESTER_USERNAME=${TESTER_USERNAME:-tester}
      - TESTER_PASSWORD=${TESTER_PASSWORD:?TESTER_PASSWORD is required}
      - COOKIE_SECURE=${COOKIE_SECURE:?COOKIE_SECURE is required}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - COOKIE_PATH=${COOKIE_PATH:-/api}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - AUTO_CREATE_TABLES=false
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      # The backend is not published directly in compose. Nginx is the only
      # ingress in the private network, so explicit proxy trust is safe here.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
      - EXECUTION_SANDBOX_ENABLED=${EXECUTION_SANDBOX_ENABLED:-true}
      - EXECUTION_CPU_LIMIT_SECONDS=${EXECUTION_CPU_LIMIT_SECONDS:-300}
      - EXECUTION_MEMORY_LIMIT_MB=${EXECUTION_MEMORY_LIMIT_MB:-2048}
      - EXECUTION_FILE_SIZE_LIMIT_MB=${EXECUTION_FILE_SIZE_LIMIT_MB:-128}
      - EXECUTION_OPEN_FILES_LIMIT=${EXECUTION_OPEN_FILES_LIMIT:-4096}
      - EXECUTION_PROCESS_LIMIT=${EXECUTION_PROCESS_LIMIT:-256}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-104857600}
      - OUTBOUND_REQUEST_TIMEOUT_SECONDS=${OUTBOUND_REQUEST_TIMEOUT_SECONDS:-20}
      - OUTBOUND_MAX_REDIRECTS=${OUTBOUND_MAX_REDIRECTS:-5}
      - OUTBOUND_MAX_RESPONSE_BYTES=${OUTBOUND_MAX_RESPONSE_BYTES:-10485760}
      # ── AI / LLM（平台简化批次：直连模式，AI_API_KEY 由本进程持有）──
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-https://api.deepseek.com/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-8192}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.3}
      - AI_EXACT_CACHE_ENABLED=${AI_EXACT_CACHE_ENABLED:-false}
      - AI_EXACT_CACHE_TTL_SECONDS=${AI_EXACT_CACHE_TTL_SECONDS:-86400}
      - AI_LOCAL_RUNTIME_ENABLED=${AI_LOCAL_RUNTIME_ENABLED:-false}
      - AI_RUNTIME_MODE=${AI_RUNTIME_MODE:-cloud_only}
      - AI_LOCAL_FALLBACK_TO_CLOUD=${AI_LOCAL_FALLBACK_TO_CLOUD:-true}
      - AI_LOCAL_BASE_URL=${AI_LOCAL_BASE_URL:-http://127.0.0.1:11434/v1}
      - AI_LOCAL_API_KEY=${AI_LOCAL_API_KEY:-}
      - AI_LOCAL_MODEL=${AI_LOCAL_MODEL:-}
      - AI_SHADOW_ENABLED=${AI_SHADOW_ENABLED:-false}
      - AI_SHADOW_SAMPLE_RATE=${AI_SHADOW_SAMPLE_RATE:-0.0}
      - AI_SHADOW_TIMEOUT_SECONDS=${AI_SHADOW_TIMEOUT_SECONDS:-60}
      - AI_SHADOW_MAX_OUTPUT_CHARS=${AI_SHADOW_MAX_OUTPUT_CHARS:-200000}
      # ── P1-6：平台级 AI 配额闸门（按项目统计 model_usage_ledger）──
      - AI_GUARD_ENABLED=${AI_GUARD_ENABLED:-true}
      - AI_RATE_LIMIT_PER_MINUTE=${AI_RATE_LIMIT_PER_MINUTE:-60}
      - AI_DAILY_TOKEN_BUDGET=${AI_DAILY_TOKEN_BUDGET:-2000000}
      # ── 蓝湖自动登录 ──
      - LANHU_COOKIE=${LANHU_COOKIE:-}
      - LANHU_USERNAME=${LANHU_USERNAME:-}
      - LANHU_PASSWORD=${LANHU_PASSWORD:-}
      - WORKSPACE_ROOT=/app
      - LANHU_MCP_DIR=/app/lanhu-mcp
      - DATA_DIR=/app/storage/lanhu-data
      # ── 知识库 / RAG / Wiki 功能开关 ──
      - KNOWLEDGE_INGEST_ENABLED=${KNOWLEDGE_INGEST_ENABLED:-true}
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - WIKI_ENABLED=${WIKI_ENABLED:-true}
      - WIKI_AUTO_INGEST_ENABLED=${WIKI_AUTO_INGEST_ENABLED:-true}
      - KNOWLEDGE_INGEST_PRODUCTION_DATA=${KNOWLEDGE_INGEST_PRODUCTION_DATA:-false}
      - LANHU_MCP_ENABLED=${LANHU_MCP_ENABLED:-true}
      - EMBEDDING_CACHE_DIR=${EMBEDDING_CACHE_DIR:-/data/models/fastembed}
      # ── 蓝湖证据包 OCR ──
      - LANHU_EVIDENCE_ENABLED=${LANHU_EVIDENCE_ENABLED:-true}
      - LANHU_OCR_PROVIDER=${LANHU_OCR_PROVIDER:-local}
      # ── SMTP（可选，仅密码重置邮件）──
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # ── 存储保留期清理（生产磁盘防护）──
      - STORAGE_RETENTION_ENABLED=${STORAGE_RETENTION_ENABLED:-false}
      - STORAGE_RETENTION_DAYS=${STORAGE_RETENTION_DAYS:-7}
      - STORAGE_RETENTION_HOUR=${STORAGE_RETENTION_HOUR:-2}
      - STORAGE_RETENTION_MINUTE=${STORAGE_RETENTION_MINUTE:-30}
    depends_on:
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    volumes:
      - tp-data:/data
      - tp-artifacts:/app/storage
    expose:
      - "8000"
    restart: unless-stopped
    # 日志轮转：容器 stdout 无上限增长会写满宿主磁盘（json-file 默认不轮转）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  runner:
    extends:
      service: backend
    image: ${RUNNER_IMAGE:-cameltv-tp-runner:latest}
    build:
      target: runner
    environment:
      WORKER_EXECUTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    init: true
    mem_limit: ${RUNNER_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  volume-permissions:
    image: ${API_IMAGE:-cameltv-tp-api:latest}
    build:
      context: ../..
      dockerfile: test-platform-v2/backend/Dockerfile
      target: api
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /data /app/storage
    volumes:
      - tp-data:/data
      - tp-artifacts:/app/storage
    restart: "no"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_ICP_NUMBER: ${VITE_ICP_NUMBER:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 只绑定回环：入站流量一律经 Caddy（80/443）反向代理，后端与前端容器都不
      # 直接暴露到公网。此前写作 "${FRONTEND_PORT:-80}:80"，等价于绑定 0.0.0.0，
      # 公网可绕过 Caddy 直连 http://<host>:8080/ 以及 /docs、/openapi.json。
      # 确需局域网直连时显式设置 FRONTEND_BIND=0.0.0.0。
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tp-data:
    driver: local
  tp-artifacts:
    driver: local
  pg-data:
    driver: local
